name: scan
description: "Bento — offline-first PDF tools + native document scanner. AGPL-3.0."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter
  file_picker: ^13.1.0
  go_router: ^18.0.1
  image: ^4.10.1
  path_provider: ^2.1.6
  pdf: ^3.13.1
  pdf_manipulator: ^5.0.0
  permission_handler: ^13.0.2
  share_plus: ^13.3.0
  shared_preferences: ^2.5.5
  google_fonts: ^8.2.1
  flutter_bloc: ^9.1.1
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0
  open_filex: ^4.7.0
  camera: ^0.12.1
  camera_android_camerax: ^0.7.5
  google_mlkit_document_scanner: ^0.6.1
  material_symbols_icons: ^4.2960.0
  dynamic_color: ^2.1.0

  material_ui: ^1.4.0
dev_dependencies:
  build_runner: ^2.16.1
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  very_good_analysis: ^11.0.0
  bloc_test: ^10.0.0
  mocktail: ^1.0.5
  freezed: ^4.0.1
  json_serializable: ^6.14.1

flutter:
  uses-material-design: true
  assets:
    # OFL license for the bundled Pixelify Sans font (see fonts below).
    - assets/fonts/OFL.txt
  fonts:
    - family: PixelifySans
      fonts:
        - asset: assets/fonts/PixelifySans-Regular.ttf
        - asset: assets/fonts/PixelifySans-Medium.ttf
          weight: 500
