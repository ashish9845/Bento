name: Release

# Builds a signed universal APK + App Bundle and publishes them to a GitHub Release.
#
# Triggers:
#   - Push a version tag:  git tag v1.0.1 && git push origin v1.0.1
#   - Manual: Actions > Release > Run workflow, with a new tag (e.g. v1.0.1)
#
# Required repository secrets (Settings > Secrets and variables > Actions):
#   - ANDROID_KEYSTORE_BASE64  base64 of android/upload-keystore.jks
#   - ANDROID_KEY_ALIAS        e.g. bento-upload
#   - ANDROID_STORE_PASSWORD   keystore password
#   - ANDROID_KEY_PASSWORD     key password
# To generate your own keystore and set these secrets, see command.md.
# Without ANDROID_KEYSTORE_BASE64 the build falls back to debug signing
# (see android/app/build.gradle.kts) — fine for testing, NOT for the Play Store.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to create (e.g. v1.0.1)'
        required: true

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve release tag
        id: tag
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "name=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
            echo "created=false" >> "$GITHUB_OUTPUT"
          else
            echo "name=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
            echo "created=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create and push tag (manual runs)
        if: steps.tag.outputs.created == 'true'
        run: |
          TAG="${{ steps.tag.outputs.name }}"
          case "$TAG" in
            v*) ;;
            *) echo "::error::Tag must start with 'v' (e.g. v1.0.1)"; exit 1 ;;
          esac
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "::error::Tag $TAG already exists"; exit 1
          fi
          git tag "$TAG"
          git push origin "$TAG"

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Restore Android upload keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::warning::ANDROID_KEYSTORE_BASE64 not set — falling back to debug signing (see android/app/build.gradle.kts). See command.md to set up release signing."
            exit 0
          fi
          echo "$KEYSTORE_B64" | tr -d '[:space:]' | base64 --decode > android/upload-keystore.jks
          {
            printf 'storePassword=%s\n' "$STORE_PASSWORD"
            printf 'keyPassword=%s\n' "$KEY_PASSWORD"
            printf 'keyAlias=%s\n' "$KEY_ALIAS"
            printf 'storeFile=%s\n' '../upload-keystore.jks'
          } > android/key.properties
          keytool -list -keystore android/upload-keystore.jks -storepass "$STORE_PASSWORD" > /dev/null || {
            echo "::error::Restored keystore failed validation — re-set ANDROID_KEYSTORE_BASE64 (see command.md) and re-run."
            exit 1
          }

      - run: flutter pub get

      - name: App version (pubspec.yaml)
        id: version
        run: echo "value=$(grep '^version:' pubspec.yaml | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - run: flutter build apk --release
      - run: flutter build appbundle --release

      - name: Stage artifacts
        run: |
          mkdir -p dist
          TAG="${{ steps.tag.outputs.name }}"
          cp build/app/outputs/flutter-apk/app-release.apk "dist/bento-$TAG.apk"
          cp build/app/outputs/bundle/release/app-release.aab "dist/bento-$TAG.aab"
          ls -la dist

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          name: Bento ${{ steps.tag.outputs.name }} (${{ steps.version.outputs.value }})
          generate_release_notes: true
          files: dist/*

      - name: Remove CI keystore material
        if: always()
        run: rm -f android/upload-keystore.jks android/key.properties
