org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# shrink=false: Flutter's Gradle plugin force-enables R8 (minify+shrink) for
# release builds by default. R8 strips the no-arg constructor of
# com.google.mlkit.common.internal.CommonComponentRegistrar (only referenced
# via reflection by MlKitInitProvider), which leaves MlKitContext
# uninitialized and makes GmsDocumentScanning.getStartScanIntent() throw an
# NPE inside Play Services on every release build (debug builds unaffected).
# Verified by dex forensics 2026-09-25. Keep this OFF (or add explicit
# proguard keep rules for all reflection-instantiated ML Kit classes).
shrink=false
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
